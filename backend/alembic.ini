# Alembic migrations for the McKinley prototype database (SQLite locally, Postgres/Supabase when DATABASE_URL is set).
# The URL is NOT stored here: migrations/env.py reads DATABASE_URL (or falls back to DB_PATH) from the environment
# or backend/.env. Run from backend/:  uv run alembic upgrade head
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
