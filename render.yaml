# Render Blueprint: two services from one repo. Backend = Python web service (FastAPI, rootDir backend); website =
# static site (Next.js static export, rootDir frontend). Guide: docs/DEPLOYMENT.md. The Vercel website option
# (frontend/vercel.json) stays supported: use either the static site below or Vercel, not both, for one backend.
# Secrets are never stored here: Render asks for the "sync: false" values when the Blueprint is first applied.
# This is a PROTOTYPE on synthetic data, not a production service (see README "Status").
services:
  - type: web
    name: mckinley-backend
    runtime: python
    plan: free              # the free plan sleeps when idle; the first request after a pause can take about a minute
    rootDir: backend
    # `env -u UV_NO_MANAGED_PYTHON`: matches the live service (set in the Dashboard after the first Blueprint build
    # failed); a Blueprint sync must not revert it.
    buildCommand: pip install uv && env -u UV_NO_MANAGED_PYTHON uv sync --frozen --no-dev
    # Migrations run before every start (idempotent); then the API. No --reload, one worker (the Store holds one
    # connection and an in-process lock).
    startCommand: env -u UV_NO_MANAGED_PYTHON uv run --no-sync alembic upgrade head && env -u UV_NO_MANAGED_PYTHON uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT --log-level info
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: UV_PYTHON_PREFERENCE  # use Render's Python; never download one into a folder that may not persist
        value: only-system
      # hosted: startup refuses unsafe settings (CORS, staff token, implicit provider, Toolkit without approval,
      # missing provider key, ...), hides /docs, turns rate limits on and demo personas OFF. The live demo's
      # Dashboard may differ (docs/DEPLOYMENT.md section 2); do not change this to local in the Blueprint.
      - key: APP_ENV
        value: hosted
      # DEMO_PERSONAS_ENABLED is deliberately not set: hosted refuses "true" (not authentication). Running the
      # synthetic resident switcher on a hosted backend needs a code change (docs/DEPLOYMENT.md section 9).
      # The one chat model, U-M GPT Toolkit gpt-6.1-sol (the model of the full evaluation). Both values are pinned so
      # a missing or leftover setting cannot switch the demo to another provider or model; no fallback model exists.
      - key: LLM_PROVIDER
        value: um_toolkit
      - key: LLM_MODEL
        value: gpt-6.1-sol
      - key: UM_TOOLKIT_MODEL
        value: gpt-6.1-sol
      - key: UM_TOOLKIT_BASE_URL
        value: https://api.toolkit.umgpt.umich.edu/v1
      - key: UM_TOOLKIT_API_KEY    # backend only, never in the website; Render asks for it on first apply
        sync: false
      # BLOCKING PREREQUISITE: set to true ONLY after the university confirms in writing that this Toolkit key may serve
      # a public website. Until then a hosted backend refuses to start (by design). Never committed as a value.
      - key: UM_TOOLKIT_HOSTED_APPROVED
        sync: false
      # Staff model list: only the demo model (no OpenRouter/Gemini targets without keys on this service).
      - key: EVAL_TARGETS
        value: um_toolkit:gpt-6.1-sol
      # A model-call cap per running instance (the free plan restarts after idle, which resets it); when spent,
      # replies fall back to the approved templates. Server time stays under the browser's 90 s: 25 s x (1 + 1
      # retry), plus the short safety call. Toolkit latency on Render has not been measured yet.
      - key: LLM_CALL_BUDGET
        value: "1500"
      - key: LLM_TIMEOUT_SECONDS
        value: "25"
      - key: LLM_MAX_RETRIES
        value: "1"
      - key: SAFETY_CLASSIFIER     # auto = the semantic safety layer runs on the same provider and model (one extra
        value: auto                #   call per turn); SAFETY_CLASSIFIER_TARGET unset = the chat model above
      - key: RESIDENT_DATA_SOURCE  # residents come from the synthetic seed in the database (no XLSX on Render)
        value: database
      - key: DATABASE_URL          # Supabase Session pooler URI; set in Render, never commit it
        sync: false
      - key: CORS_ORIGINS          # the exact website address: the Render static site (https://<name>.onrender.com)
        sync: false                #   and/or the Vercel site; comma-separated, https only, no paths
      - key: STAFF_API_TOKEN       # Render makes up a long random value
        generateValue: true

  # The website: a static site on Render's CDN (free). It only ever calls the backend above; it holds no secrets.
  - type: web
    name: mckinley-frontend
    runtime: static
    rootDir: frontend
    # NEXT_STATIC_EXPORT must reach the build step (not just npm ci); it is also set below.
    buildCommand: npm ci && NEXT_STATIC_EXPORT=1 npm run build
    staticPublishPath: out
    envVars:
      - key: NEXT_STATIC_EXPORT
        value: "1"
      - key: NEXT_PUBLIC_API_BASE_URL  # the backend's public https address; PUBLIC by design (built into the site)
        sync: false
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: redirect             # /staff/index.html is exported (trailingSlash); keep /staff working
        source: /staff
        destination: /staff/
    headers:                       # same headers as frontend/vercel.json
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
